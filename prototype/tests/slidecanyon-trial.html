<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>미끄럼 협곡 · 이동 시험 구간</title>
<style>
body{margin:0;font:16px system-ui,sans-serif;background:#c6e6f2;color:#223544;overflow:hidden}
header{position:absolute;inset:0 0 auto;background:#fffffff2;padding:12px;z-index:3;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h1{font-size:18px;margin:0}button{font:inherit;padding:9px 12px;border:1px solid #789;border-radius:8px;background:white}
p{margin:0;width:100%;font-size:14px}canvas{display:block;touch-action:none}
#stick{display:none;position:fixed;width:120px;height:120px;transform:translate(-50%,-50%);border-radius:50%;background:#ffffff55;pointer-events:none;z-index:4}
#stick.active{display:block}#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#ffffffbb}
.actions{position:fixed;right:16px;bottom:24px;z-index:4;display:flex;gap:12px}.actions button{touch-action:none}
output{position:fixed;bottom:8px;left:12px;background:#ffffffe6;padding:6px;pointer-events:none;z-index:3;font-size:14px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<header><h1>미끄럼 협곡 · 제작 전 이동 시험</h1>
<button data-start="hill">내리막·언덕</button><button data-start="bend">감속 굽이</button>
<button data-start="glide">매끈한 평지</button><button data-start="grip">거친 평지</button><button data-start="normal">보통 평지</button>
<button id="pause">일시정지</button><button id="retry">다시 출발</button>
<p>WASD·방향키 / 왼쪽 터치 이동 / 오른쪽 드래그 시점. 언덕을 못 넘으면 오른쪽 길로 갑니다. 주황 바닥에서 감속합니다.</p>
</header>
<div id="stick"><div id="knob"></div></div>
<div class="actions"><button id="jump">점프</button><button id="dive">다이브</button></div>
<output id="status">불러오는 중…</output>
<script type="module">
import * as THREE from 'three';
import { PhysicsWorld } from '../src/physics.js';
import { Player } from '../src/player.js';
import { Input } from '../src/input.js';
import { buildSlideCanyonTrial } from '../src/levels/slidecanyon-trial.js';
import { SLIDE_SURFACES } from '../src/slide-motion.js';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xc6e6f2);
scene.add(new THREE.HemisphereLight(0xffffff,0x758091,2));
const light = new THREE.DirectionalLight(0xffffff,2);light.position.set(20,40,20);scene.add(light);
const world = new PhysicsWorld(), level = buildSlideCanyonTrial(scene,world), player = new Player(scene);
const renderer = new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);
const camera = new THREE.PerspectiveCamera(60,1,0.1,300);
const $ = id => document.getElementById(id);
const input = new Input({surface:renderer.domElement,stickBase:$('stick'),stickKnob:$('knob'),jumpBtn:$('jump'),diveBtn:$('dive')});
input.onJump=()=>player.requestJump();input.onDive=()=>player.requestDive();
const starts={hill:[10,0,4],bend:[-14,0,-12],glide:[-24,0,65],grip:[-14,0,65],normal:[-4,0,65]};
let chosen='hill',paused=false,yaw=0,time=0,acc=0,last=performance.now();
function reset(){level.resetProgress();player.respawn(new THREE.Vector3(...starts[chosen]));yaw=0;acc=0;}
document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{chosen=b.dataset.start;reset();});
$('retry').onclick=reset;
$('pause').onclick=()=>{paused=!paused;input.enabled=!paused;acc=0;$('pause').textContent=paused?'계속하기':'일시정지';};
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();reset();
renderer.setAnimationLoop(()=>{
 const now=performance.now(),dt=Math.min((now-last)/1000,0.05);last=now;input.poll();
 const look=input.consumeLook();if(!paused)yaw-=look.x*0.004;
 if(!paused){acc+=dt;while(acc>=1/120){time+=1/120;level.update(time,1/120,player);player.step(1/120,input.move,yaw,world,level.windAt,level.gravityAt);acc-=1/120;}}
 if(player.pos.y < -12)reset();
 camera.position.set(player.pos.x+Math.sin(yaw)*12,player.pos.y+8,player.pos.z+Math.cos(yaw)*12);
 camera.lookAt(player.pos.x,player.pos.y+1,player.pos.z);
 player.updateVisual(dt,time);renderer.render(scene,camera);
 $('status').textContent=paused?'일시정지 중':level.finished?'시험 결승 도착 · 다른 길도 시도해 보세요':`바닥: ${player.ground?.slideSurface===SLIDE_SURFACES.glide?'매끈함':player.ground?.slideSurface?'거침':'보통'} · 오른쪽 길로 안전하게 우회할 수 있어요`;
});
</script>
</html>
